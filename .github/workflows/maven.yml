



name: Java CL with Maven

on: 
  push:
    branches: [ "dev" ]
  pull_request:
    branches: 
      - dev
      - release


jobs: 
  cli-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
      - name: Verify with Maven
        run: mvn -B verify
  




  
